spring.application.name=ai-buyer
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/aibuyer}
spring.datasource.username=${DATABASE_USER:aibuyer}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.mapper.allow-coercion-of-scalars=false
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=ai-buyer
app.jwt.audience=ai-buyer-api
app.auth.attempt-limit=${AUTH_ATTEMPT_LIMIT:20}
app.auth.window-seconds=${AUTH_WINDOW_SECONDS:60}
server.error.include-message=never
server.error.include-stacktrace=never

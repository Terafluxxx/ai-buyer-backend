services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: aibuyer
      POSTGRES_USER: aibuyer
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibuyer -d aibuyer"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/aibuyer
      DATABASE_USER: aibuyer
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:

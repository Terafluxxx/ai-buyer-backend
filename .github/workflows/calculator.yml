name: Calculator checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  calculator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: javac -d target/calculator src/main/java/ru/aibuyer/mvp/analytics/RecommendationCalculator.java src/test/java/ru/aibuyer/mvp/analytics/CalculatorChecks.java
      - run: java -cp target/calculator ru.aibuyer.mvp.analytics.CalculatorChecks

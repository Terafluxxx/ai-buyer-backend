      summary: Ошибки импорта по строкам
      description: Сортировка row ASC, field ASC. Одна ошибка на невалидную строку, первая по порядку столбцов;
        row=2 для первой строки данных. errorCount — число ошибочных строк. Во время RUNNING список может расти.
      operationId: get_imports_importId_errors
      tags:
      - Imports
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportErrorPage'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: importId
        in: path
        required: true
        schema: *id001
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100

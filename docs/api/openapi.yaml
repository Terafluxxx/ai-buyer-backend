openapi: 3.0.3
info:
  title: AI Закупщик — контракт REST API
  version: 1.0.0-draft
  description: Предлагаемый контракт MVP по ИС2 (1).pdf. Допущения и обязательные межполевые бизнес-правила см.
    API.md. Это спецификация, не реализация сервера.
servers:
- url: http://localhost:8080/api/v1
  description: Локальная разработка; production — HTTPS на домене проекта
security:
- bearerAuth: []
tags:
- name: Auth
- name: Company
- name: Products
- name: Inventory
- name: Sales
- name: Suppliers
- name: Analytics
- name: Purchases
- name: Imports
paths:
  /auth/register:
    post:
      summary: Регистрация и создание организации
      description: Атомарно создаёт компанию и пользователя. Email уникален глобально без учёта регистра. Вход в
        существующую организацию по companyId запрещён. Location указывает /api/v1/auth/me.
      operationId: post_auth_register
      tags:
      - Auth
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
          headers:
            Location:
              description: Относительный URI созданного ресурса /api/v1/...
              schema:
                type: string
        '409':
          $ref: '#/components/responses/Error409'
        '400':
          $ref: '#/components/responses/Error400'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '422':
          $ref: '#/components/responses/Error422'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
  /auth/login:
    post:
      summary: Вход
      description: Неверные email и пароль дают одинаковый 401 INVALID_CREDENTIALS. Новый sid на каждую сессию.
      operationId: post_auth_login
      tags:
      - Auth
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '409':
          $ref: '#/components/responses/Error409'
        '400':
          $ref: '#/components/responses/Error400'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '401':
          $ref: '#/components/responses/Error401'
        '422':
          $ref: '#/components/responses/Error422'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
  /auth/logout:
    post:
      summary: Выход из текущей сессии
      description: Отзывает sid текущего JWT до exp. Другие сессии не затрагиваются; повтор с уже отозванным JWT
        даёт 401.
      operationId: post_auth_logout
      tags:
      - Auth
      responses:
        '204':
          description: Успешно, тело отсутствует
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
  /auth/me:
    get:
      summary: Текущий пользователь и компания
      description: Текущий пользователь и компания
      operationId: get_auth_me
      tags:
      - Auth
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
  /companies/current:
    get:
      summary: Текущая организация
      description: Текущая организация
      operationId: get_companies_current
      tags:
      - Company
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
  /products:
    get:
      summary: Список и поиск товаров
      description: Список и поиск товаров
      operationId: get_products
      tags:
      - Products
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - name,asc
          - name,desc
          - sku,asc
          - createdAt,desc
          default: name,asc
        description: Одно значение field,direction. Вторичная сортировка id ASC.
      - name: q
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 100
        description: Подстрока sku или name, регистр не учитывается.
      - name: category
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: Точное совпадение категории.
    post:
      summary: Создать товар
      description: SKU уникален внутри компании и регистрозависим. Создаёт inventory с quantity=0, version=1. category
        и preferredSupplierId по умолчанию null; preferredSupplierId при создании должен быть null, поскольку предложение
        ещё не существует.
      operationId: post_products
      tags:
      - Products
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          headers:
            Location:
              description: Относительный URI созданного ресурса /api/v1/...
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
  /products/{productId}:
    get:
      summary: Карточка товара
      description: Карточка товара
      operationId: get_products_productId
      tags:
      - Products
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: productId
        in: path
        required: true
        schema: &id001
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          description: Положительный BIGINT как строка; не более 9223372036854775807.
          example: '101'
    patch:
      summary: Изменить товар
      description: Только переданные поля; null разрешён только category и preferredSupplierId. Выбранный поставщик
        должен иметь предложение для товара. version обязателен.
      operationId: patch_products_productId
      tags:
      - Products
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: productId
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPatch'
    delete:
      summary: Удалить товар без истории
      description: 409 RESOURCE_IN_USE при ненулевом остатке, продажах или любой закупке. При успехе удаляются inventory
        и предложения; расчёты помечаются устаревшими. Старые снимки сохраняются, но непригодны для новой закупки.
      operationId: delete_products_productId
      tags:
      - Products
      responses:
        '204':
          description: Успешно, тело отсутствует
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: productId
        in: path
        required: true
        schema: *id001
      - name: version
        in: query
        required: true
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
  /inventory:
    get:
      summary: Список остатков
      description: Сортировка productId ASC. Ровно одна запись на товар; один склад компании.
      operationId: get_inventory
      tags:
      - Inventory
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryPage'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: productId
        in: query
        required: false
        schema: *id001
  /products/{productId}/inventory:
    get:
      summary: Остаток товара
      description: Остаток товара
      operationId: get_products_productId_inventory
      tags:
      - Inventory
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inventory'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: productId
        in: path
        required: true
        schema: *id001
    put:
      summary: Установить абсолютный остаток
      description: quantity заменяет остаток, не прибавляет его. Проверка version атомарна с записью. Изменение
        делает расчёты устаревшими.
      operationId: put_products_productId_inventory
      tags:
      - Inventory
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inventory'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: productId
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventorySet'
  /sales:
    get:
      summary: Продажи за период
      description: Даты включительно, dateFrom<=dateTo<=сегодня UTC; максимум 366 дней. Сортировка saleDate DESC,
        id ASC.
      operationId: get_sales
      tags:
      - Sales
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalePage'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: productId
        in: query
        required: false
        schema: *id001
      - name: dateFrom
        in: query
        required: true
        schema: &id002
          type: string
          format: date
          example: '2026-10-25'
      - name: dateTo
        in: query
        required: true
        schema: *id002
  /products/{productId}/sales/{saleDate}:
    put:
      summary: Записать продажи товара за день
      description: 'Upsert абсолютного дневного количества. Новая строка: version=0; существующая: её текущая version.
        Всегда 200. Не изменяет складской остаток. quantity=0 допускается; saleDate не позже сегодня UTC.'
      operationId: put_products_productId_sales_saleDate
      tags:
      - Sales
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: saleDate
        in: path
        required: true
        schema: *id002
      - name: productId
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleSet'
  /sales/summary:
    get:
      summary: Сумма продаж за период
      description: 'Те же границы, что у GET /sales. productCount — количество разных товаров с quantity>0 за период,
        totalQuantity — сумма quantity. Пустой период: оба счётчика 0.'
      operationId: get_sales_summary
      tags:
      - Sales
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesSummary'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: productId
        in: query
        required: false
        schema: *id001
      - name: dateFrom
        in: query
        required: true
        schema: *id002
      - name: dateTo
        in: query
        required: true
        schema: *id002
  /suppliers:
    get:
      summary: Список поставщиков
      description: Список поставщиков
      operationId: get_suppliers
      tags:
      - Suppliers
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierPage'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - name,asc
          - name,desc
          default: name,asc
        description: Одно значение field,direction. Вторичная сортировка id ASC.
      - name: q
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 100
    post:
      summary: Создать поставщика
      description: Нормализованное имя (trim + регистр без учёта) уникально в компании; это также ключ CSV-импорта.
      operationId: post_suppliers
      tags:
      - Suppliers
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
          headers:
            Location:
              description: Относительный URI созданного ресурса /api/v1/...
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierCreate'
  /suppliers/{supplierId}:
    get:
      summary: Карточка поставщика
      description: Карточка поставщика
      operationId: get_suppliers_supplierId
      tags:
      - Suppliers
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: supplierId
        in: path
        required: true
        schema: *id001
    patch:
      summary: Переименовать поставщика
      description: Переименовать поставщика
      operationId: patch_suppliers_supplierId
      tags:
      - Suppliers
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'
      parameters:
      - name: supplierId
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierPatch'
    delete:
